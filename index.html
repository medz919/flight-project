<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flight Departures</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --board: #0f0f1a;
      --row: #13131f;
      --row-alt: #0f0f18;
      --accent: #f5c518;
      --green: #00e676;
      --red: #ff1744;
      --orange: #ff9100;
      --text: #e8e8f0;
      --dim: #5a5a7a;
      --border: #1e1e35;
      --font-mono: 'Share Tech Mono', monospace;
      --font-display: 'Bebas Neue', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      padding: 0;
    }

    /* ── Header ── */
    header {
      background: var(--board);
      border-bottom: 2px solid var(--accent);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 2.2rem;
      color: var(--accent);
      letter-spacing: 3px;
      line-height: 1;
    }

    .tagline {
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .clock {
      font-size: 1.6rem;
      color: var(--accent);
      letter-spacing: 4px;
    }

    .clock-label {
      font-size: 0.6rem;
      color: var(--dim);
      letter-spacing: 2px;
      text-align: right;
    }

    /* ── Controls ── */
    .controls {
      padding: 16px 32px;
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--board);
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 6px 14px;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.15s;
    }

    .filter-btn:hover, .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .refresh-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 6px 16px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: var(--accent);
      color: var(--bg);
    }

    /* ── Board ── */
    .board-container {
      padding: 24px 32px;
    }

    /* Column headers */
    .board-header {
      display: grid;
      grid-template-columns: 80px 140px 1fr 1fr 120px 160px 120px;
      gap: 0;
      padding: 8px 16px;
      background: #0c0c15;
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--accent);
      margin-bottom: 2px;
    }

    .col-label {
      font-size: 0.6rem;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Flight rows */
    .flight-row {
      display: grid;
      grid-template-columns: 80px 140px 1fr 1fr 160px 120px;
      gap: 0;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-top: none;
      background: var(--row);
      transition: background 0.2s;
      animation: rowIn 0.4s ease both;
      cursor: default;
    }

    .flight-row:nth-child(even) { background: var(--row-alt); }
    .flight-row:hover { background: #1a1a2e; }

    @keyframes rowIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .cell {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: 12px;
    }

    .flight-number {
      font-size: 1rem;
      color: var(--accent);
      letter-spacing: 2px;
    }

    .airline-name {
      font-size: 0.75rem;
      color: var(--text);
      letter-spacing: 1px;
    }

    .airline-iata {
      font-size: 0.6rem;
      color: var(--dim);
      margin-top: 2px;
    }

    .airport-code {
      font-size: 1.1rem;
      letter-spacing: 3px;
      color: var(--text);
    }

    .airport-name {
      font-size: 0.6rem;
      color: var(--dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    .time-val {
      font-size: 1rem;
      letter-spacing: 2px;
      color: var(--text);
    }

    .time-label {
      font-size: 0.6rem;
      color: var(--dim);
      margin-top: 2px;
      letter-spacing: 1px;
    }

    /* Status badge */
    .status {
      display: inline-block;
      font-size: 0.65rem;
      letter-spacing: 2px;
      padding: 4px 8px;
      text-transform: uppercase;
      font-weight: bold;
      border: 1px solid;
      width: fit-content;
    }

    .status-scheduled  { color: #64b5f6; border-color: #64b5f620; background: #64b5f608; }
    .status-active     { color: var(--green); border-color: #00e67620; background: #00e67608; animation: pulse 2s infinite; }
    .status-landed     { color: var(--green); border-color: #00e67620; background: #00e67608; }
    .status-cancelled  { color: var(--red); border-color: #ff174420; background: #ff174408; }
    .status-delayed    { color: var(--orange); border-color: #ff910020; background: #ff910008; }
    .status-unknown    { color: var(--dim); border-color: #5a5a7a20; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* ── Loading / Error ── */
    .state-message {
      text-align: center;
      padding: 60px 32px;
      color: var(--dim);
      letter-spacing: 3px;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .state-message .big {
      font-family: var(--font-display);
      font-size: 3rem;
      color: var(--border);
      display: block;
      margin-bottom: 12px;
      letter-spacing: 6px;
    }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    .count-badge {
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 2px;
      margin-left: 4px;
    }

    /* ── Search ── */
    .search-wrap {
      padding: 12px 32px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      background: var(--board);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 9px 16px;
      letter-spacing: 2px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input::placeholder {
      color: var(--dim);
      letter-spacing: 2px;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 9px 14px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.15s;
    }

    .search-clear:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .search-count {
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 2px;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .board-header,
      .flight-row {
        grid-template-columns: 90px 1fr 1fr 100px;
      }
      .col-airline, .cell-airline,
      .col-scheduled, .cell-scheduled { display: none; }
      header { padding: 12px 16px; }
      .board-container { padding: 12px 16px; }
      .controls { padding: 10px 16px; }
    }
  
.autocomplete-wrapper {
  position: relative;
  width: 100%;
}
.autocomplete-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #1a1a2e;
  border: 1px solid #c9a84c;
  border-top: none;
  max-height: 250px;
  overflow-y: auto;
  z-index: 1000;
  display: none;
}
.autocomplete-item {
  padding: 10px 14px;
  cursor: pointer;
  color: #fff;
  font-size: 13px;
  border-bottom: 1px solid rgba(201,168,76,0.1);
}
.autocomplete-item:hover {
  background: rgba(201,168,76,0.2);
}
.autocomplete-item .iata {
  font-weight: bold;
  color: #c9a84c;
  margin-right: 8px;
}
.autocomplete-item .city {
  color: #aaa;
  font-size: 11px;
}

@media (max-width: 768px) {
  /* Search form stacks vertically */
  .search-form-row {
    flex-direction: column !important;
    gap: 10px !important;
  }
  .search-form-group {
    width: 100% !important;
  }
  /* Search button full width */
  #searchFlightsBtn {
    width: 100% !important;
    padding: 12px !important;
    font-size: 16px !important;
  }
  /* Header smaller */
  header h1, .departures-title {
    font-size: 24px !important;
  }
  /* Hide VIA and SCHEDULED columns on mobile */
  .col-via, .cell-via,
  .col-scheduled, .cell-scheduled {
    display: none !important;
  }
  /* Flight rows smaller */
  .flight-row, .board-header {
    grid-template-columns: 60px 1fr 1fr !important;
    font-size: 12px !important;
  }
  /* Status badge smaller */
  .status-badge {
    font-size: 10px !important;
    padding: 3px 6px !important;
  }
  /* Filters wrap */
  .filters {
    flex-wrap: wrap !important;
    gap: 6px !important;
  }
  .filter-btn {
    font-size: 11px !important;
    padding: 4px 10px !important;
  }
  /* Clock smaller */
  .clock {
    font-size: 16px !important;
  }
  /* Passengers dropdown full width */
  #passengersInput {
    width: 100% !important;
  }
  /* Date input full width */
  #dateInput {
    width: 100% !important;
  }
  /* Controls padding */
  .controls {
    padding: 8px 12px !important;
  }
  /* Board container */
  .board-container {
    padding: 8px 12px !important;
  }
  /* Autocomplete dropdown */
  .autocomplete-dropdown {
    font-size: 12px !important;
  }
  .autocomplete-item {
    padding: 8px 10px !important;
  }
}

@media (max-width: 480px) {
  /* Extra small phones */
  .flight-number {
    font-size: 11px !important;
  }
  header {
    padding: 10px 12px !important;
  }
  .col-airline, .cell-airline {
    display: none !important;
  }
  .flight-row, .board-header {
    grid-template-columns: 55px 1fr 80px !important;
  }
}
</style>
<style>
.search-form { background: #0f0f1a; padding: 20px 32px; border-bottom: 1px solid #1e1e35; }
.search-form-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.search-form-group { display: flex; flex-direction: column; gap: 6px; }
.search-form-group label { font-size: 0.6rem; color: #f5c518; letter-spacing: 2px; font-family: 'Share Tech Mono', monospace; }
.search-form-group input, .search-form-group select { background: #13131f; border: 1px solid #1e1e35; color: #e8e8f0; padding: 8px 12px; font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; outline: none; text-transform: uppercase; min-width: 100px; }
.search-form-group input:focus, .search-form-group select:focus { border-color: #f5c518; }
#searchFlightsBtn { background: #f5c518; color: #0a0a0f; border: none; padding: 8px 24px; font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; letter-spacing: 2px; cursor: pointer; font-weight: bold; height: 36px; }
#searchFlightsBtn:hover { background: #fff; }
</style></head>
<body>

<header>
  <div class="header-left">

    </div>
  </div>
  <div style="text-align:right">
    <div class="clock" id="clock">--:--:--</div>

</header>

<div class="search-form">
<!-- Trip Type Selector -->
<div style="display:flex;gap:10px;margin-bottom:15px">
<button onclick="setTripType('oneway',this)" id="btnOneway" style="background:#f5c518;color:#000;border:none;padding:8px 20px;cursor:pointer;border-radius:4px;font-weight:bold;font-family:monospace">ONE WAY</button>
<button onclick="setTripType('roundtrip',this)" id="btnRoundtrip" style="background:transparent;color:#f5c518;border:1px solid #f5c518;padding:8px 20px;cursor:pointer;border-radius:4px;font-weight:bold;font-family:monospace">ROUND TRIP</button>
<button onclick="setTripType('multicity',this)" id="btnMulticity" style="background:transparent;color:#f5c518;border:1px solid #f5c518;padding:8px 20px;cursor:pointer;border-radius:4px;font-weight:bold;font-family:monospace">MULTI-CITY</button>

  <input type="text" id="fromInput" placeholder="City or airport..." autocomplete="off" />
  <div class="autocomplete-dropdown" id="fromDropdown"></div>
</div></div><div class="search-form-group"><label>TO</label><div class="autocomplete-wrapper"><input type="text" id="toInput" placeholder="City or airport..." autocomplete="off" /><div class="autocomplete-dropdown" id="toDropdown"></div></div></div><div class="search-form-group"><label>DATE</label><input type="date" id="dateInput" /></div><div class="search-form-group"><label>PASSENGERS</label><select id="passengersInput"><option value="1">1 Adult</option><option value="2">2 Adults</option><option value="3">3 Adults</option><option value="4">4 Adults</option></select></div><button id="searchFlightsBtn">SEARCH</button></div></div><!-- Return Date Field -->

</div></div>
<div class="search-form-row">
<div class="search-form-group"><label>FLIGHT 3 FROM</label>
<input type="text" id="mc3From" placeholder="City or airport..." style="background:#13131f;border:1px solid #1e1e35;color:#e8e8f0;padding:8px 12px;font-family:monospace;min-width:100px"/>
</div>
<div class="search-form-group"><label>FLIGHT 3 TO</label>
<input type="text" id="mc3To" placeholder="City or airport..." style="background:#13131f;border:1px solid #1e1e35;color:#e8e8f0;padding:8px 12px;font-family:monospace;min-width:100px"/>

<div class="controls">

  <button class="filter-btn" data-filter="landed">Landed</button>

<div class="board-container">
  <div class="board-header">
    <div class="col-label">Flight</div>
    <div class="col-label col-airline">Airline</div>
    <div class="col-label">From</div>
    <div class="col-label">To</div>
    <div class="col-label">Via</div><div class="col-label col-scheduled">Scheduled</div>
    <div class="col-label">Status</div>
  </div>
  <div id="flightBoard">
    <div class="state-message">
      <span class="big">LOADING</span>
      Fetching live flight data...
    </div>
  </div>
</div>

<script>
  // ── Clock ──
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-US', { hour12: false });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── Helpers ──
  function statusClass(status) {
    if (!status) return 'status-unknown';
    const s = status.toLowerCase();
    if (s.includes('cancel')) return 'status-cancelled';
    if (s.includes('delay'))  return 'status-delayed';
    if (s.includes('active') || s.includes('air')) return 'status-active';
    if (s.includes('land'))   return 'status-landed';
    if (s.includes('sched'))  return 'status-scheduled';
    return 'status-unknown';
  }

  function formatTime(str) {
    if (!str) return '--:--';
    try {
      return new Date(str).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    } catch { return '--:--'; }
  }

  function short(str, len = 18) {
    if (!str) return '—';
    return str.length > len ? str.slice(0, len) + '…' : str;
  }

  // ── Render ──
  let allFlights = [];
  let activeFilter = 'all';

  function renderFlights(flights) {
    const board = document.getElementById('flightBoard');
    if (!flights.length) {
      board.innerHTML = `<div class="state-message"><span class="big">NO DATA</span>No flights match this filter.</div>`;
      return;
    }

    board.innerHTML = flights.map((f, i) => {
      const dep = f.departure || {};
      const arr = f.arrival   || {};
      const airline = f.airline || {};
      const flight  = f.flight  || {};
      const status  = f.flight_status || 'unknown';
      const sClass  = statusClass(status);
      const delay   = parseInt(dep.delay) > 0 ? `style="animation-delay:${i * 0.04}s"` : `style="animation-delay:${i * 0.04}s"`;

      return `
        <div class="flight-row" ${delay}>
          <div class="cell">
            <div class="flight-number">${flight.iata || flight.icao || '—'}</div>
          </div>
          <div class="cell cell-airline">
            <div class="airline-name">${short(airline.name || '—', 16)}</div>
            <div class="airline-iata">${airline.iata || ''}</div>
          </div>
          <div class="cell">
            <div class="airport-code">${dep.iata || '—'}</div>
            <div class="airport-name">${short(dep.airport || '', 22)}</div>
          </div>
          <div class="cell">
            <div class="airport-code">${arr.iata || '—'}</div>
            <div class="airport-name">${short(arr.airport || '', 22)}</div>
          </div>
          <div class="cell cell-scheduled">
            <div class="time-val">${formatTime(dep.scheduled)}</div>
            <div class="time-label">${dep.delay ? `+${dep.delay}min delay` : 'on time'}</div>
          </div>
          <div class="cell">
            <span class="status ${sClass}">${status.toUpperCase()}</span>
          </div>
          <div class="cell">
            <div class="time-val" style="color:#f5c518">${(() => {
              const segs = f.slices?.[0]?.segments || [];
              const stops = segs.length - 1;
              const dep = segs[0]?.departing_at;
              const arr = segs[segs.length-1]?.arriving_at;
              if(dep && arr) {
                const mins = Math.round((new Date(arr) - new Date(dep)) / 60000);
                const h = Math.floor(mins/60), m = mins%60;
                return h + 'h ' + m + 'm';
              }
              return '--';
            })()}</div>
            <div class="time-label">${(() => {
              const stops = (f.slices?.[0]?.segments?.length || 1) - 1;
              return stops === 0 ? 'direct' : stops + ' stop' + (stops > 1 ? 's' : '');
            })()}</div>
          </div>
          <div class="cell">
            <div class="time-val" style="color:#00e676">${f.total_amount ? parseFloat(f.total_amount).toFixed(0) + ' ' + (f.total_currency || '') : '--'}</div>
            <div class="time-label">price</div>
          </div>
        </div>\`;
    }).join('');
  }

  // ── Search ──
  let searchQuery = '';
document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value.toLowerCase().trim();
  document.getElementById('searchClear').style.display = searchQuery ? 'block' : 'none';

  function getFilteredFlights() {
    let flights = allFlights;

    // Apply status filter
    if (activeFilter !== 'all') {
      flights = flights.filter(f => {
        const s = (f.flight_status || '').toLowerCase();
        if (activeFilter === 'scheduled') return s.includes('sched');
        if (activeFilter === 'active')    return s.includes('active') || s.includes('air');
        if (activeFilter === 'landed')    return s.includes('land');
        if (activeFilter === 'cancelled') return s.includes('cancel');
        if (activeFilter === 'delayed')   return s.includes('delay') || parseInt((f.departure||{}).delay) > 0;
        return true;
      });
    }

    // Apply search filter
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      flights = flights.filter(f => {
        const dep = f.departure || {};
        const arr = f.arrival   || {};
        const airline = f.airline || {};
        const flight  = f.flight  || {};
        return (
          (flight.iata  || '').toLowerCase().includes(q) ||
          (flight.icao  || '').toLowerCase().includes(q) ||
          (airline.name || '').toLowerCase().includes(q) ||
          (airline.iata || '').toLowerCase().includes(q) ||
          (dep.iata     || '').toLowerCase().includes(q) ||
          (dep.airport  || '').toLowerCase().includes(q) ||
          (arr.iata     || '').toLowerCase().includes(q) ||
          (arr.airport  || '').toLowerCase().includes(q)
        );
      });
    }

    return flights;
  }

  function updateSearchCount(count) {
    const el = document.getElementById('searchCount');
    el.textContent = searchQuery ? `${count} RESULT${count !== 1 ? 'S' : ''}` : '';
  }

  function applyFilter(filter) {
    activeFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.filter === filter);
    });
    const filtered = getFilteredFlights();
    updateSearchCount(filtered.length);
    renderFlights(filtered);
  }

  async function loadFlights(origin, destination, date, passengers) {
    const board = document.getElementById('flightBoard');
    board.innerHTML = `<div class="state-message"><span class="big">LOADING</span>Fetching live data...</div>`;

    try {
        const res = await fetch('https://flight-project-production-7ab7.up.railway.app/flights/search', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin: origin||'MNL', destination: destination||'SIN', date: date||'2026-06-01', adults: parseInt(passengers)||1})});
      const data = await res.json();
      allFlights = (data.data || []).map(offer => {
    const slice = offer.slices?.[0] || {};
    const segments = slice.segments || [];
    console.log('SEGMENTS COUNT:', segments.length, 'DATA:', JSON.stringify(segments.map(s => ({from: s.origin?.iata_code, to: s.destination?.iata_code}))));
    let stops = null;
    if (segments.length > 1) {
      stops = segments.slice(0, -1).map(s => {
        const dest = s.destination || {};
        return dest.iata_code || dest.iata_city_code || '';
      }).filter(Boolean).join(', ');
    }
    const duration = slice.duration || null;
    return {
      flight: { iata: segments[0]?.operating_carrier_flight_number || '-' },
      airline: { name: offer.owner?.name || '-', iata: offer.owner?.iata_code || '' },
      departure: { iata: slice.origin?.iata_code || '-', airport: slice.origin?.name || '-', scheduled: slice.departing_at || null, delay: 0 },
      arrival: { iata: slice.destination?.iata_code || '-', airport: slice.destination?.name || '-' },
      flight_status: 'scheduled',
      stops: stops || null,
      duration: duration,
      segments: segments.length
    };
  });

      if (!allFlights.length) {
        board.innerHTML = `<div class="state-message"><span class="big">EMPTY</span>No flight data returned.</div>`;
        return;
      }

      applyFilter(activeFilter);
    } catch (err) {
      board.innerHTML = `<div class="state-message"><span class="big">ERROR</span>Could not connect to server. Is it running on port 3001?</div>`;
    }
  }

  // ── Events ──
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => applyFilter(btn.dataset.filter));
  });

function setupAutocomplete(inputId, dropdownId) {
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  if (!input || !dropdown) return;

  input.addEventListener('input', function() {
    const val = this.value.toLowerCase().trim();
    dropdown.innerHTML = '';
    if (val.length < 1) { dropdown.style.display = 'none'; return; }

    const matches = airports.filter(a =>
      a.iata.toLowerCase().includes(val) ||
      a.name.toLowerCase().includes(val) ||
      a.city.toLowerCase().includes(val) ||
      a.country.toLowerCase().includes(val)
    ).slice(0, 8);

    if (matches.length === 0) { dropdown.style.display = 'none'; return; }

    matches.forEach(a => {
      const item = document.createElement('div');
      item.className = 'autocomplete-item';
      item.innerHTML = '<span class="iata">' + a.iata + '</span>' + a.name + '<br><span class="city">' + a.city + ', ' + a.country + '</span>';
      item.addEventListener('click', function() {
        input.value = a.iata;
        dropdown.style.display = 'none';
      });
      dropdown.appendChild(item);
    });
    dropdown.style.display = 'block';
  });

  document.addEventListener('click', function(e) {
    if (!input.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.style.display = 'none';
    }
  });
}

  const airline = row.querySelector('.airline-name')?.textContent;

  const from = cells[0]?.textContent;
  const to = cells[1]?.textContent;
  selectedFlight = { airline, flight, from, to };
  document.getElementById('flightSummary').innerHTML = 
    `<b>Flight:</b> ${flight} | <b>Airline:</b> ${airline}<br><b>Route:</b> ${from} ✈ ${to}`;
  document.getElementById('bookingModal').style.display = 'block';
});
